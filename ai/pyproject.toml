[project]
name = "contexa-ai"
version = "0.2.0"
description = "Contexa의 AI 인턴: 문서를 발언으로 자르고, 카드·줄 후보를 뽑아 서버에 제출한다"
requires-python = ">=3.11"
dependencies = [
    # 모델 연결(llm.py)에만 쓴다. 모델은 CONTEXA_MODEL=공급자:모델로 바꾼다. 서버와의 통신은 표준 라이브러리로 한다.
    "langchain>=1.5",
    "langchain-core>=1.8",
    "langchain-anthropic>=1.7",
    # 작업 한 번 안의 단계 제어(answer_graph.py, extract_graph.py)에만 쓴다. 체크포인터·interrupt는 쓰지 않는다.
    "langgraph>=1.2",
]

[project.optional-dependencies]
# 호출 추적. LANGFUSE_* 키가 있을 때만 켜진다(tracing.py).
observability = ["langfuse>=5"]

[project.scripts]
contexa-worker = "contexa_ai.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contexa_ai"]

[tool.setuptools.package-data]
contexa_ai = ["prompts/*.md"]
