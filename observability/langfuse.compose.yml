# Langfuse를 이 컴퓨터에만 띄운다. AI 일꾼의 모델 호출 추적과 평가 비교용이다(선택).
#
#   cp observability/langfuse.env.example observability/.env   # 비밀값을 채운다. .env는 커밋하지 않는다
#   docker compose -f observability/langfuse.compose.yml --env-file observability/.env up -d
#   http://localhost:3000  (.env의 LANGFUSE_INIT_USER_EMAIL / PASSWORD로 로그인)
#   docker compose -f observability/langfuse.compose.yml --env-file observability/.env down   # 끄기(데이터는 남는다)
#
# Langfuse 공식 docker-compose.yml(main, langfuse 4)을 줄인 것이다. 바꾼 점:
# - 호스트에는 웹 화면 3000 하나만 127.0.0.1로 연다. Postgres·ClickHouse·Redis·MinIO는 도커 안에서만 보인다.
#   이 컴퓨터의 5432는 다른 Postgres가, 5434는 contexa DB가 쓰고 있어서 공식 파일 그대로는 부딪힌다.
# - AI 게이트웨이는 쓰지 않아서 뺐다. 사용 통계 전송(TELEMETRY_ENABLED)은 끈다.
# - 로그인 비밀값과 API 키는 .env에서 받고, 없으면 띄우지 않는다. 안에서만 쓰는 DB 비밀번호는 기본값을 둔다.
# - 처음 띄울 때 조직·프로젝트·사용자·API 키를 .env 값으로 만든다(LANGFUSE_INIT_*). 같은 키를 일꾼에 넣는다.
# 메모리를 몇 GB 쓴다(ClickHouse가 가장 크다). 추적·평가할 때만 켠다.

name: contexa-langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${LF_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?observability/.env에 LANGFUSE_SALT를 넣는다}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?observability/.env에 LANGFUSE_ENCRYPTION_KEY(openssl rand -hex 32)를 넣는다}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD:-myredissecret}

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?observability/.env에 LANGFUSE_NEXTAUTH_SECRET를 넣는다}
      LANGFUSE_INIT_ORG_ID: contexa
      LANGFUSE_INIT_ORG_NAME: Contexa
      LANGFUSE_INIT_PROJECT_ID: contexa-ai
      LANGFUSE_INIT_PROJECT_NAME: contexa-ai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?observability/.env에 LANGFUSE_PUBLIC_KEY(pk-lf-...)를 넣는다}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?observability/.env에 LANGFUSE_SECRET_KEY(sk-lf-...)를 넣는다}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?observability/.env에 LANGFUSE_INIT_USER_EMAIL을 넣는다}
      LANGFUSE_INIT_USER_NAME: contexa
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?observability/.env에 LANGFUSE_INIT_USER_PASSWORD를 넣는다}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # 'langfuse' 버킷을 만들고 띄운다
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD:-miniosecret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: >
      --requirepass ${LF_REDIS_PASSWORD:-myredissecret}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
